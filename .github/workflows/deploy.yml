name: deploy

# Builds the SPA and publishes it to GitHub Pages on every push to main.
#
# ONE-TIME SETUP, by the repo owner:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# or:  gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
#
# configure-pages cannot do this itself: the default GITHUB_TOKEN is refused with
# "Resource not accessible by integration" when the Pages site does not yet exist,
# whatever permissions the workflow declares.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gates CI runs, so a broken build never reaches Pages.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
