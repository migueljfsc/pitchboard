version: 2
updates:
  # pnpm dependencies. Grouped to keep PR volume low on a small project.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
      timezone: Europe/Lisbon
    # Only surface releases that have been public for at least 7 days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Actions used by ci / deploy / terraform workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope

  # OpenTofu provider pins in the Cloudflare stack.
  - package-ecosystem: terraform
    directory: "/infrastructure/terraform/cloudflare"
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
