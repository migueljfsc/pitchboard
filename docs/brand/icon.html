<!doctype html>
<!-- The app icon, full bleed: iOS and Android round or mask it themselves. The mark sits
     inside the central 70%, a maskable icon's safe zone. `render.sh` draws it at each size. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; background: #0e1f17; }
  svg { position: absolute; left: 15vw; top: 15vw; width: 70vw; height: 70vw; }
</style>
</head>
<body>
<svg viewBox="2 2 28 28" fill="none" stroke="#eef1ea" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4.4 19.9 11.6 27.1 M11.6 19.9 4.4 27.1" />
  <path d="M9.5 17 C 10.5 5, 22 4.5, 23.5 16" />
  <path d="M23.5 16 l1.8 -3.6 M23.5 16 l-2.8 -2.9" />
  <circle cx="24.2" cy="23.6" r="3.6" />
</svg>
</body>
</html>
